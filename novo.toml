[package]
name        = "can-nv"
version     = "0.1.0"
description = "The CAN bus on a microcontroller and on Linux behind one interface: classic and CAN FD frames as values, acceptance filters by mask and by list, the error-confinement state machine, a bit-timing solver, a transmit queue that sends by arbitration priority and a receive ring over the caller's frames, ISO-TP, candump lines, drivers for ST's bxCAN and FDCAN (Bosch M_CAN), a loopback controller for tests and emulators, and SocketCAN over raw sockets.  Nothing is allocated after start-up on a device."
license     = "Apache-2.0"

stability   = "experimental"

# `host`: the drivers perform `[hw]`, the loopback controller and the
# transmit queue's slot readers `[mutate]`, and `cansocket` `[net]` and
# `[fs]`.  The interface was `core` with `cansocket` as its host module,
# when every body was arithmetic; with the two controller drivers in the
# package the surface performs on a device too, and `host` is the layer
# that says so.  Everything a device build reaches is `[hw, mutate]`
# at most, and the frames, the filters, the timing and the state
# machines are still `[]`.
layer       = "host"

category    = "embedded"

tags        = ["can", "canbus", "can-fd", "socketcan", "iso-tp", "candump", "embedded", "automotive", "no-alloc"]
repository  = "https://github.com/novolang/can-nv"
maintainers = ["novo-lang"]
# The toolchain floor: embedded-hal-nv 0.3.0, which `canboard` is
# written over, calls hal.can, which 0.19.3 first has.
novo        = ">= 0.19.3"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "A CAN frame that fits in three integers"

[dependencies]
# The board's CAN controller, which `canboard` reaches through
# `CanBus` and the handle `BoardCan`.  The transmit queue and the
# receive ring keep their own bookkeeping over a `Vec[CanFrame; N]` the
# caller declares, the language's own fixed-capacity storage.
embedded-hal-nv = "^0.3.0"
